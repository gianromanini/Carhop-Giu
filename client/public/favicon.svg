<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Carrinho verde com contorno branco - tamanho maior -->
  <g>
    <!-- Corpo do carro verde com contorno branco -->
    <path d="M 120 280 Q 100 280 100 260 L 120 180 Q 130 150 160 150 L 352 150 Q 382 150 392 180 L 412 260 Q 412 280 392 280 Z" 
          fill="#22c55e" stroke="white" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Janela frontal esquerda -->
    <rect x="150" y="184" width="64" height="56" fill="none" stroke="white" stroke-width="8" rx="6"/>
    <rect x="150" y="184" width="64" height="56" fill="none" stroke="#22c55e" stroke-width="4" rx="6"/>
    
    <!-- Janela frontal direita -->
    <rect x="298" y="184" width="64" height="56" fill="none" stroke="white" stroke-width="8" rx="6"/>
    <rect x="298" y="184" width="64" height="56" fill="none" stroke="#22c55e" stroke-width="4" rx="6"/>
    
    <!-- Roda esquerda - aro branco externo -->
    <circle cx="170" cy="330" r="44" fill="none" stroke="white" stroke-width="10"/>
    <!-- Roda esquerda - aro verde -->
    <circle cx="170" cy="330" r="44" fill="none" stroke="#22c55e" stroke-width="4"/>
    <!-- Centro roda esquerda -->
    <circle cx="170" cy="330" r="16" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="170" cy="330" r="16" fill="none" stroke="#22c55e" stroke-width="3"/>
    
    <!-- Roda direita - aro branco externo -->
    <circle cx="342" cy="330" r="44" fill="none" stroke="white" stroke-width="10"/>
    <!-- Roda direita - aro verde -->
    <circle cx="342" cy="330" r="44" fill="none" stroke="#22c55e" stroke-width="4"/>
    <!-- Centro roda direita -->
    <circle cx="342" cy="330" r="16" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="342" cy="330" r="16" fill="none" stroke="#22c55e" stroke-width="3"/>
  </g>
</svg>
