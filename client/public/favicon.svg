<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Carrinho maior com contorno branco e verde -->
  <g>
    <!-- Contorno branco exterior (mais espesso) -->
    <path d="M 15 52 L 22 35 L 38 28 L 62 28 L 78 35 L 85 52 L 80 70 L 20 70 Z" 
          fill="none" stroke="white" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Contorno verde interior -->
    <path d="M 15 52 L 22 35 L 38 28 L 62 28 L 78 35 L 85 52 L 80 70 L 20 70 Z" 
          fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Janelas com contorno duplo -->
    <rect x="28" y="36" width="18" height="14" fill="none" stroke="white" stroke-width="3" rx="1"/>
    <rect x="28" y="36" width="18" height="14" fill="none" stroke="#22c55e" stroke-width="1.5" rx="1"/>
    
    <rect x="54" y="36" width="18" height="14" fill="none" stroke="white" stroke-width="3" rx="1"/>
    <rect x="54" y="36" width="18" height="14" fill="none" stroke="#22c55e" stroke-width="1.5" rx="1"/>
    
    <!-- Rodas externas brancas -->
    <circle cx="30" cy="73" r="8.5" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="70" cy="73" r="8.5" fill="none" stroke="white" stroke-width="4"/>
    
    <!-- Rodas internas verdes -->
    <circle cx="30" cy="73" r="8.5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="70" cy="73" r="8.5" fill="none" stroke="#22c55e" stroke-width="2"/>
    
    <!-- Centro das rodas -->
    <circle cx="30" cy="73" r="3.5" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="73" r="3.5" fill="none" stroke="#22c55e" stroke-width="1"/>
    
    <circle cx="70" cy="73" r="3.5" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="70" cy="73" r="3.5" fill="none" stroke="#22c55e" stroke-width="1"/>
  </g>
</svg>
